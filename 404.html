<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects</title>
</head>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        font-size: 16px;
        background-color: #F4F4F4;
        color: #333;
    }

    h1 {
        background-color: #185337;
        color: white;
        padding: 20px 40px;
        display: flex;
        text-align: center;
    }

    h1 a {
        color: white;
        text-decoration: none;
    }

    img {
        width: 400px;
        height: 225px;
        padding: 10px;
    }


    .accessDenied {
        text-align: center;
        padding: 20px;
        font-size: 70px;
    }

    button {
        background-color: #16795B;
        color: white;
        border-radius: 7px;
        font-size: 25px;
        padding: 10px;
        border: none;
        transition: 0.5s;
    }

    button:hover {
        background-color: #E9F6E9;
        color: #007007;
    }

    button a {
        color: white;
        text-decoration: none;
    }

    button a:hover {
        color: #007007;
        text-decoration: none;
    }

    footer {
        background-color: #16795B;
        color: white;
        padding: 20px 40px;
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
    }

    ::-moz-selection {
        /* Code for Firefox */
        color: white;
        background: #004231;
    }

    ::selection {
        color: white;
        background: #004231;
    }

    .mailto {
        text-align: center;
        font-size: large;
    }

    .mailto a {
        color: #004231;
    }
</style>

<body>
    <h1><a href="https://www.vedranrock.github.io/MyRepos">My Projects</a></h1>

    <div class="accessDenied">
        <img src="images/taco_vip.png" alt="">
        <br>
        Error 404.
        <br>
        Page not Found!
    </div>
    <div class="mailto">
        Check that your spelling is correct.
        <br>
        Bug? Contact here: <a href="mailto:vedranrock@gmail.com">vedranrock@gmail.com</a>
    </div>

    <div style="text-align: center; padding: 25px;">
        <button>
            <a href="https://www.vedranrock.github.io/MyRepos">Back to Home</a>
        </button>
    </div>


    <footer>
        <p>&copy; 2025 My Projects. All rights reserved.</p>
    </footer>
</body>

</html>
